name: Build Beton Hisab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir project
          unzip -q Beton_Hisab_Offline_FIXED.zip -d project

      - name: Find project folder
        run: |
          echo "Searching for settings.gradle.kts..."
          find project -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Beton-Hisab-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
